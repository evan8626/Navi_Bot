[[finding]]
id = "MC-103"
title = "Goal-tolerance boundary differs between compute_control (<) and is_goal_reached (>)"
severity = "low"
category = "logic"
file = "navi_bot/control/motion_controller.py"
anchor = "if distance_error < self.goal_tolerance:"
symbol = "MotionController.compute_control"
source = "reviewer"
confidence = "confirmed"
reviewed_line = 131
what = '''
At distance == goal_tolerance, is_goal_reached returns True (it only fails on distance > tol,
line 162) while compute_control still drives (it stops only on distance < tol). No test covers
the boundary.
'''
why = '''
A caller that stops issuing commands on is_goal_reached and one that trusts compute_control
disagree at the boundary; minor but a classic off-by-epsilon inconsistency.
'''
evidence = '''
Read lines 131 and 162.
'''
hint = '''
Use the same comparison in both methods (compute_control could call is_goal_reached).
'''

[[finding]]
id = "MC-106"
title = "normalize_angle duplicated from utils/geometry and loops forever on inf"
severity = "low"
category = "duplication"
file = "navi_bot/control/motion_controller.py"
anchor = "while angle > np.pi:"
symbol = "MotionController.normalize_angle"
source = "reviewer"
confidence = "confirmed"
lead_checked = true
reviewed_line = 173
what = '''
MotionController.normalize_angle is a copy of navi_bot/utils/geometry.normalize_angle
(geometry.py 73-79). Both use while-loops: inf - 2*pi == inf, so an inf input never terminates
(NaN returns NaN silently).
'''
why = '''
Duplicate logic drifts; a single bad pose (inf theta from a division by zero upstream) hangs the
50 Hz control loop.
'''
evidence = '''
Read: motion_controller.py 171-177 and geometry.py 73-79 are identical loops; inf - 2*pi == inf
in IEEE-754.
'''
hint = '''
Use geometry.normalize_angle everywhere and implement it as math.atan2(math.sin(a), math.cos(a))
(or a modulo), which is O(1) and terminates for all inputs.
'''

