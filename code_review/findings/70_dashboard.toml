handler that calls preventDefault for anything other than the local file, and a CSP.
'''

[[finding]]
id = "EL-103"
title = "Running test processes are not killed on window close; event.sender used after it may be destroyed"
severity = "low"
category = "robustness"
file = "telemetry_dashboard/main.js"
anchor = "app.on('window-all-closed', () => { if (process.platform !== 'darwin') app.quit(); });"
source = "reviewer"
confidence = "likely"
lead_checked = true
reviewed_line = 26
what = '''
No 'before-quit' or window 'closed' handler kills runningProcs. On macOS the app stays alive
after the window closes, and on POSIX children outlive the parent, so a long integration suite
(up to 55 s) keeps running. Its stream callbacks then call event.sender.send (L65, L69, L86-87)
on a destroyed WebContents. Recent Electron throws 'Object has been destroyed' there, which
becomes an uncaught exception in the main process. On Windows, libuv's job object kills children
when Electron exits, so the problem is mainly macOS/Linux and the window-closed-but-app-alive
case.
'''
why = '''
Orphaned Python processes and main-process exceptions.
'''
evidence = '''
Read main.js L25-27 and L58-88. No cleanup hooks. The throw-on-destroyed behaviour is from the
Electron API and was not reproduced here (launching Electron is forbidden).
'''
hint = '''
On 'before-quit' and window 'closed', kill everything in runningProcs. Before sending, check `if
(!event.sender.isDestroyed())`.
'''

