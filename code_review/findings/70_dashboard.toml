[[finding]]
id = "EL-108"
title = "Spawn failure sends both test:error and test:done; synchronous errors escape the try"
severity = "low"
category = "robustness"
file = "telemetry_dashboard/main.js"
anchor = "proc.on('error', (err) => { delete runningProcs[file]; event.sender.send('test:error', { file, msg: err.message }); });"
symbol = "ipcMain 'test:run'"
source = "reviewer"
confidence = "reproduced"
reviewed_line = 86
what = '''
When python is not on PATH, Node emits 'error' (ENOENT) and then 'close' with code -4058, so the
renderer gets test:error (which sets _pendingExit=1) and then test:done, which overwrites it
with -4058. The suite shows 'exit -4058' instead of a clear 'python not found'. Also,
path.join(testsDir, file) at L49 runs outside the try, so a non-string testsDir throws an
uncaught exception in the main-process IPC listener. The try/catch around spawn catches only
argument errors, not ENOENT.
'''
why = '''
The most common setup failure (python missing) gets a confusing message. The main process can
throw on bad input.
'''
evidence = '''
node misc.js: spawn('definitely_not_a_cmd_xyz') -> 'event error ENOENT' then 'event close
-4058'.
'''
hint = '''
Track a `failed` flag so 'close' after 'error' sends nothing. Validate the arguments before
path.join. Show a 'python not found on PATH' message.
'''

