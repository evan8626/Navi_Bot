[[finding]]
id = "DB-112"
title = "A stopped run's late close resets the next run's state; late lines rewrite a finalized result"
severity = "medium"
category = "bug"
file = "telemetry_dashboard/index.html"
anchor = "activeRun=null; activeRunTest=null; stopRequested=false; liveFollow=false;"
symbol = "finishRun"
source = "reviewer"
confidence = "reproduced"
lead_checked = true
reviewed_line = 1188
what = '''
stopRun (L1126-1134) calls finishRun(file,-1) straight away and says the process's later close
'is ignored'. It is not fully ignored. (1) The killed process can still send stdout lines.
onTestLine -> _bufferLine -> appendLine pushes them into runResults[file].lines after exit is
already set, regroups the cases, and calls mergeCaseFromRun, so a finished result's verdicts can
still change. (2) The later 'test:done' calls finishRun(file, code), which clears
activeRun/activeRunTest/stopRequested/liveFollow at L1188, before the `result.exit!==null` guard
at L1190. If the user has started a different suite B by then, B's activeRun is wiped. B keeps
streaming, but the UI treats nothing as running, live-follow stops, and startRun's 'one run at a
time' guard (L1162) lets a third run start alongside B.
'''
why = '''
Concurrent runs, the wrong Stop/Run button state, case verdicts on a stopped suite that change
afterwards, and lost live preview.
'''
evidence = '''
node runner_race.js scenario 1: 'B started: activeRun = geometry_test.py' -> (A's close arrives)
'after A close: activeRun = null (B is still running, pid 2)'; 'A finished result now has lines:
[ TEST 1: first, FAIL: late line from the killed A process ]'; 'A case verdicts: [[1,false]]';
'a THIRD run was allowed to start concurrently with B: true | procs alive: [ geometry_test.py,
kinematics_test.py ]'.
'''
hint = '''
Move the guard to the top of finishRun, before any global state changes, and only reset
activeRun when activeRun === file. Better, use the run-id scheme and drop lines and exits from
runs that are no longer active.
'''

