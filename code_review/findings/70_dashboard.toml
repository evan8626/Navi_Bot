'''
hint = '''
Count changes of avoidance side or episodes, not steps, and rate-limit the log line.
'''

[[finding]]
id = "EL-102"
title = "No navigation/window-open guards, no CSP, sandbox only implicit"
severity = "low"
category = "security"
file = "telemetry_dashboard/main.js"
anchor = "webPreferences: {"
symbol = "createWindow"
source = "reviewer"
confidence = "confirmed"
lead_checked = true
reviewed_line = 16
what = '''
webPreferences turns on contextIsolation and turns off nodeIntegration, which is good. But there
is no will-navigate handler and no setWindowOpenHandler, sandbox:true is not set explicitly (it
relies on Electron's default since v20), and no CSP is set anywhere. If the page navigates (for
example via the liveLog XSS: location='https://x'), the preload still runs in the new origin and
exposes window.navi to it.
'''
why = '''
Electron's security checklist covers all of these. They are cheap defence in depth for the IPC
surface, which runs processes.
'''
evidence = '''
main.js L8-21. index.html has no CSP meta tag. Nothing calls webContents.on('will-navigate') or
setWindowOpenHandler.
'''
hint = '''
