# field reference and how findings are marked fixed.

[[finding]]
id = "DB-109"
title = "Case verdicts come from free-text regex; last match wins, so later chatter flips FAIL to PASS"
severity = "high"
category = "logic"
file = "telemetry_dashboard/index.html"
anchor = "else if (cur) { cur.lines.push(l); if (isPass(l.text)) cur.passed=true; if (isFail(l.text)) cur.passed=false; }"
symbol = "groupIntoCases"
source = "reviewer"
confidence = "reproduced"
lead_checked = true
reviewed_line = 828
what = '''
groupIntoCases (L824-831) sets a case's verdict from EVERY line after the header that matches
isPass/isFail (L821-822), and the last match wins. isPass/isFail are \bpass(ed)?\b /
\bfail(ed)?\b over arbitrary log text, and isSuiteSummary (L820) throws away ANY line containing
a 'n/m' ratio. Lines that go wrong: 'Robot passed waypoint 2 while recovering' after a 'FAIL:
collided' line flips the case to PASS; 'FAIL: only 2/3 waypoints reached' and 'PASS: visited 3/3
waypoints' give no verdict because of the ratio; 'Retries: 0 failed attempts' and 'Engaging
fail-safe stop' count as FAIL; 'Robot will pass the obstacle' and '/data/pass/warehouse.pgm'
count as PASS; 'FAIL: robot did not pass the waypoint' and 'PASS: no planner call failed' give
no verdict because both words appear; a crash traceback gives no verdict. classForLine
(L811-817) shares the problem. The real header 'TEST 19: Planning — path must not pass through
occupied cells' (path_planner_test) is coloured green as a PASS line, and in appendLine
(L1239/L1257) it is treated as a verdict line, which calls showCase early.
'''
why = '''
The per-case pass/fail dots and the passed/failed counts are the Tests tab's core output. One
later log line containing 'pass' turns a failed case green. The suite badge partly hides this:
computeSuiteBadge still says 'fail' when the exit code is non-zero, but the case rows and the 'n
passed' summary are wrong.
'''
evidence = '''
node adversarial.js (functions taken from index.html L476-598, L804-831): 'FAIL then later
chatter: [ true ]'; '"FAIL: only 2/3 waypoints reached" isPass false isFail false'; '"Retries: 0
failed attempts" isFail true'; '"Engaging fail-safe stop" isFail true'; '"Loading map from
/data/pass/warehouse.pgm" isPass true'; '"TEST 19: Planning — path must not pass through
occupied cells" isPass true cls level-pass'; 'crash traceback no verdict: [ null ]'. Control:
node verdicts.js over all 21 real suite logs matches every 'Results: n/m passed' line, so
today's log wording happens to parse correctly.
'''
hint = '''
Have the Python runner print one machine-readable verdict per case (for example '##RESULT 7
PASS') and parse only that line. Fall back to the exit code when no verdict appears. Do not
infer verdicts from prose.
'''

