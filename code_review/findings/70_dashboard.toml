[[finding]]
id = "DB-116"
title = "Live map hard-coded to 20x20 at 0.5 m/cell; real map is 200x200 at 0.05 m, and map_init can't resize"
severity = "medium"
category = "design"
file = "telemetry_dashboard/index.html"
anchor = "const liveRows=20, liveCols=20;"
source = "reviewer"
confidence = "confirmed"
lead_checked = true
reviewed_line = 1370
what = '''
liveRows/liveCols are constants. map_init (L1439-1442) assigns f.grid without reading its size.
drawLiveMap (L1385-1391) always loops 20x20 over it, so a larger grid shows only its top-left
20x20 cells (1 m x 1 m of a 10 m map) and a smaller grid throws TypeError at grid[r][cc2].
liveExplored is always rebuilt at 20x20. Pose is shown as col*0.5 / row*0.5 metres (L1451-1452),
which is 10x the project's 0.05 m resolution. Obstacles are drawn only where a cell `===1`, but
a ROS nav_msgs/OccupancyGrid uses 0..100 and -1 in a flat row-major array, so real occupied
cells (100) would draw as free. Row 0 is drawn at the top, while the ROS map origin is at the
bottom left, so the map would also appear upside down.
'''
why = '''
Even once a publisher exists, the tab would draw the wrong part of the map at the wrong scale
and miss obstacles.
'''
