Read L1370-1391 and L1439-1457. The brief and map assets give 200x200 cells at 0.05 m. For a
10-row grid, drawLiveMap reads grid[10][0], which is undefined[0] and throws.
'''
hint = '''
Take rows, cols and resolution from map_init. Accept the OccupancyGrid encoding (flat data,
width, height, values 0-100 and -1, origin) and size the canvas from it. Convert world metres to
cells with the same world_to_grid convention as utils/geometry.
'''

[[finding]]
id = "DB-117"
title = "WebSocket frame text goes into innerHTML unescaped, and window.navi turns that into code execution"
severity = "medium"
category = "security"
file = "telemetry_dashboard/index.html"
anchor = "d.innerHTML=`<span class=\"ll-ts\">${ts}s</span><span class=\"ll-msg\">${msg}</span>`;"
symbol = "liveLog"
source = "reviewer"
confidence = "confirmed"
lead_checked = true
reviewed_line = 1404
what = '''
liveLog builds its HTML with innerHTML from `msg`, which comes straight from the network: `case
'log': liveLog(f.msg,f.level||'')` (L1466) and `liveLog('Replan: '+(f.reason||''),'warn')`
(L1462). esc() exists (L1298) but is not used here. There is no Content-Security-Policy (no
<meta http-equiv>, and main.js sets no headers), and the page already relies on inline handlers,
so a frame such as {"type":"log","msg":"<img src=x onerror=...>"} runs script in the renderer.
That script can call window.navi.runTest(file, testsDir) and window.navi.listTests, and main.js
never validates either argument (separate finding), so the main process will spawn python on any
path, including a UNC share. f.level and f.cls only reach className, so they inject classes, not
markup.
'''
why = '''
Realistic threat model: this is a local dev tool, and the user types the WebSocket URL (default
ws://localhost:8765). The attacker would have to be the server the user connected to, meaning
any local process on that port or a remote endpoint the user chose. Nothing in the repo produces
frames today. Likelihood is low, but the impact is arbitrary code execution from one JSON
message, so it is worth closing.
'''
evidence = '''
Read L1401-1407 and L1436-1468: no escaping on the msg path. grep found no
Content-Security-Policy in index.html or main.js. Chain to main: preload.js L6/L9 pass
file/testsDir through, and main.js L49 uses path.join(testsDir, file). node paths.js:
path.win32.join('\\\\attacker\\share\\tests','x.py') -> '\\attacker\share\tests\x.py'.
'''
hint = '''
Set textContent on the message span instead of using innerHTML, the same way appendLine uses
esc(). Add a strict CSP meta tag (script-src 'self') after moving the inline handlers to
addEventListener.
'''

[[finding]]
id = "DB-118"
title = "Reconnect race: the old socket's onclose nulls the new wsConn and hides the live UI"
severity = "medium"
category = "bug"
file = "telemetry_dashboard/index.html"
anchor = "liveLog('Disconnected','warn'); wsConn=null;"
symbol = "connectWS"
source = "reviewer"
confidence = "confirmed"
lead_checked = true
reviewed_line = 1433
what = '''
connectWS closes the previous socket and makes a new one (L1416-1419), but the handlers close
over the shared global, not their own socket. When the old socket's close event arrives
(asynchronously, after the new socket exists), its onclose sets wsConn=null, hides #live-feed
and shows the connect card again (L1429-1434). Example: double-click Connect while
'connecting...'. The first socket's onclose nulls the second. The second then opens and shows
the feed, but disconnectWS (L1471) finds wsConn null and the Disconnect button does nothing.
Clicking Connect again leaves the earlier live socket open.
'''
why = '''
The UI and the real connection get out of step, sockets leak, and Disconnect does nothing.
'''
evidence = '''
Read L1414-1471. The handlers refer to `wsConn` and to DOM nodes, never to `this` or a local
socket variable, and onclose sets wsConn=null without checking which socket closed.
'''
hint = '''
Use `const ws = new WebSocket(url); wsConn = ws;` and in each handler return early with `if (ws
!== wsConn) return;`.
'''

