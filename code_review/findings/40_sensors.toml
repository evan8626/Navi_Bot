[[finding]]
id = "LD-104"
title = "scan_match rotates by -theta (row-vector product) and estimates rotation from mean bearing differences"
severity = "medium"
category = "bug"
file = "navi_bot/sensors/lidar_processing.py"
anchor = "cur = np.dot(cur, np.array([[cos_theta, -sin_theta], [sin_theta, cos_theta]])) + np.array([tx, ty])"
symbol = "LidarProcessor.scan_match"
source = "reviewer"
confidence = "reproduced"
lead_checked = true
known_wip = true
reviewed_line = 170
what = '''
L170 multiplies row vectors by R (cur @ R), which applies R^T, a rotation by -t_theta. Every
update therefore rotates the wrong way. L165 estimates rotation as the mean of atan2 bearing
differences about the sensor origin. That is not a rigid-alignment estimate, it is unweighted by
range, and it wraps: two points 0.002 rad apart across the +-pi seam contribute ~6.28 rad.
Translation (L163-164) is estimated before rotation from un-centred points, so the two are
coupled.
'''
why = '''
ICP diverges or stalls; this is the root cause of the 9 failing scan_matching tests (e.g. pure
translation 0.2,-0.1 returns -0.177,-0.072).
'''
evidence = '''
python
C:/Users/evan8/AppData/Local/Temp/claude/738ef417e18052f3/0a4a6808-43fe-4936-9d58-6cdc90f47f1a/code_review/evidence/reviewer-scripts/tests_sensors/icp_probe.py:
'row-vector cur@R for theta=+0.3 gives [[ 0.9553 -0.2955]] (CCW should give [0.9553 0.2955] )';
'bearing diff across seam (true ~0.002 rad): 6.2812'. Suite log: 'FAIL translation: got
(-0.1771, -0.0717, 0.0217), want (0.2, -0.1, 0.0)'.
'''
hint = '''
Use R @ p (or cur @ R.T). Solve rotation and translation jointly from centred correspondences
(Kabsch/SVD, or a point-to-line least squares).
'''

[[finding]]
id = "LD-105"
title = "scan_match returns only the last iteration's increment and never applies initial_guess"
severity = "medium"
category = "bug"
file = "navi_bot/sensors/lidar_processing.py"
anchor = "dx, dy, dtheta = tx, ty, t_theta"
symbol = "LidarProcessor.scan_match"
source = "reviewer"
confidence = "reproduced"
lead_checked = true
known_wip = true
also_reported = 1
reviewed_line = 176
what = '''
initial_guess is unpacked (L150) and copied into tx,ty,t_theta (L156), but cur is never
pre-transformed by it, and the loop overwrites tx/ty/t_theta on the first pass. Per-iteration
increments are never composed, so L176 returns only the final small correction, not the
accumulated transform. The spec (scan_matching_test docstring L8-21, tests 2-6) requires the
total transform, with initial_guess as the starting prior.
'''
why = '''
A converged ICP would return ~(0,0,0) whatever the true motion. The odometry prior is silently
ignored (test 6).
'''
evidence = '''
python
C:/Users/evan8/AppData/Local/Temp/claude/738ef417e18052f3/0a4a6808-43fe-4936-9d58-6cdc90f47f1a/code_review/evidence/reviewer-scripts/tests_sensors/icp_probe.py:
'identity scans with initial_guess=(5,5,1) -> (0.0, 0.0, 0.0)'.
'''
hint = '''
Apply the guess to cur before the loop and compose each increment into a running (x, y, theta).
Return the composition.
'''

