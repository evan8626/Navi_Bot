# Sensors (LIDAR, odometry, IMU)
#
# Curated code-review findings. One [[finding]] per defect.
# `anchor` is a literal piece of the offending line; the report re-locates it on
# every build, so line numbers never go stale. See code_review/README.md for the
# field reference and how findings are marked fixed.

[[finding]]
id = "LD-001"
title = "Thin obstacles and anything beyond ~3.4 m are filtered out as noise"
severity = "high"
category = "logic"
file = "navi_bot/sensors/lidar_processing.py"
anchor = "db = DBSCAN(eps=CLUSTER_EPS, min_samples=CLUSTER_MIN_SAMPLES).fit(obstacles)"
symbol = "LidarProcessor.detect_obstacles"
source = "lead"
confidence = "reproduced"
also_reported = 2
what = '''
DBSCAN is run with eps = 0.3 m and min_samples = 10. At 1 degree per beam, neighbouring returns
are r x 0.0175 m apart, so ten returns within 0.3 m of each other requires an object at least
ten beams wide and closer than about 3.4 m. Everything else is labelled noise and dropped.
'''
why = '''
A chair or table leg, a person's legs, a pallet at 5 m: none of them is reported. The perception
layer is blind to exactly the obstacles a warehouse robot most needs to see. The test fixtures
all sit at 1-3 m and 17+ beams wide, so the suite is green.
'''
hint = '''
Fixed clustering parameters cannot suit a sensor whose point spacing grows with range. Ask what
the smallest obstacle the robot must not hit looks like in beams at each range.
'''

[[finding]]
id = "LD-002"
title = "Every obstacle is reduced to one point, so a wall becomes a small disc"
severity = "high"
category = "design"
file = "navi_bot/sensors/lidar_processing.py"
anchor = "'centroid': cluster_points.mean(axis=0),"
symbol = "LidarProcessor.detect_obstacles"
source = "lead"
confidence = "reproduced"
also_reported = 2
what = '''
detect_obstacles() returns one centroid per cluster and update_costmap() stamps a robot-radius
disc at that centroid.
'''
why = '''
A 4 m wall enters the costmap as a 0.55 m disc at its middle - 86% of it is missing - and the
centroid of an L- or U-shaped obstacle can lie in free space.
'''
hint = '''
A costmap needs the obstacle's extent. What information is thrown away between the cluster's
points and its centroid?
'''

[[finding]]
id = "LD-003"
title = "update_costmap() writes obstacles with x and y swapped, in the wrong frame"
severity = "high"
category = "bug"
file = "navi_bot/sensors/lidar_processing.py"
anchor = "row = int(x / costmap.resolution)"
symbol = "LidarProcessor.update_costmap"
source = "lead"
confidence = "reproduced"
also_reported = 2
what = '''
The method maps x to the row and y to the column; utils.geometry.world_to_grid - used by the
planner and the map - maps x to the column and y to the row. It also uses the robot-frame
centroid directly, with no robot pose and no map origin, and int() truncates towards zero so
small negative coordinates land in cell 0.
'''
why = '''
Obstacles are written mirrored across the map diagonal, relative to the robot instead of the
world, and anything behind or to the right of the robot is dropped or misplaced. Every costmap
test uses obstacles with x == y and recomputes the expected cell with the same formula, so none
can fail.
'''
hint = '''
There is already one function in the project that defines how a world point maps to a cell.
'''

