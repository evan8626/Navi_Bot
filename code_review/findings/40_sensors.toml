[[finding]]
id = "IM-101"
title = "Complementary filter design fuses accelerometer tilt into yaw, which accelerometers cannot observe"
severity = "medium"
category = "logic"
file = "navi_bot/sensors/imu_processor.py"
anchor = "# TODO: Compute angle from acceleromteter (tilt)"
symbol = "ImuProcessor.update_orientation"
source = "reviewer"
confidence = "confirmed"
known_wip = true
reviewed_line = 111
what = '''
self.orientation is the heading (L31), but the planned correction is an accelerometer tilt
angle. Gravity gives roll and pitch only, so yaw/heading is unobservable from an accelerometer.
The current placeholder accel_angle=0.0 with alpha=0.98 makes the heading decay toward 0 (steady
state 0.245 rad at 0.5 rad/s). imu_test test 9 correctly expects no decay, but its docstring
('no contradicting accelerometer reference') implies such a reference could exist for yaw.
'''
why = '''
Following the TODO as written would bias heading toward an unrelated tilt angle. Heading
correction needs a magnetometer, scan matching or another absolute yaw source.
'''
evidence = '''
Reading L99-115. Steady state of o = 0.98*(o + 0.5*0.01): o* = 0.0049/0.02 = 0.245 rad, versus
the expected 1.0 rad after 2 s.
'''
hint = '''
Integrate the gyro for yaw (with bias correction) and reserve the complementary filter for
roll/pitch, or fuse yaw with a magnetometer or ICP heading. Reword the test 9 docstring.
'''

[[finding]]
id = "IM-102"
title = "Yaw 'complementary filter' with accel_angle=0 decays the heading to zero; detect_motion fires on gravity"
severity = "medium"
category = "logic"
file = "navi_bot/sensors/imu_processor.py"
anchor = "accel_angle = 0.0"
symbol = "ImuProcessor.update_orientation"
source = "reviewer"
confidence = "reproduced"
known_wip = true
reviewed_line = 112
what = '''
orientation = 0.98*(orientation+w*dt) + 0.02*0, so a stationary robot's heading decays
exponentially toward 0. Accelerometers cannot observe yaw at all, so a heading complementary
filter needs another absolute reference. detect_motion compares |a| including gravity (9.81)
against 0.1, so it always reports motion at rest.
'''
why = '''
Heading estimate is wrong after ~1 s; motion detection is always True.
'''
evidence = '''
python code_review/evidence/reviewer-scripts/src_nodes/misc_repro.py: 'stationary (gyro=0)
heading 1.0 rad after 1 s at 100 Hz -> 0.1326 (should stay 1.0)', 'detect_motion() at rest with
gravity on z -> True'.
'''
hint = '''
Integrate gyro only for yaw (fuse with odometry/scan matching instead); remove gravity before
detect_motion.
'''

