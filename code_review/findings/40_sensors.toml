[[finding]]
id = "OD-001"
title = "Odometry translates along the end-of-step heading, biasing every turn"
severity = "medium"
category = "bug"
file = "navi_bot/sensors/odometry.py"
anchor = "self.x += delta_s * np.cos(self.theta)"
symbol = "WheelOdometry.update"
source = "lead"
confidence = "reproduced"
also_reported = 2
what = '''
update() adds the step's rotation to theta and then moves delta_s along the NEW heading. The
robot actually travelled along headings between the old and the new one.
'''
why = '''
Every curved step is rotated by half its turn angle. Over a 1 m-radius quarter circle in 8
updates the pose is ~14 cm off; kinematics.compute_pose_update integrates the same motion
exactly, so the project has two motion models that disagree.
'''
hint = '''
Which heading best represents a step that starts at theta and ends at theta + dtheta?
'''

[[finding]]
id = "OD-002"
title = "The first update treats the encoders' absolute count as distance travelled"
severity = "medium"
category = "robustness"
file = "navi_bot/sensors/odometry.py"
anchor = "self.prev_left_ticks = 0"
symbol = "WheelOdometry.__init__"
source = "lead"
confidence = "reproduced"
also_reported = 2
what = '''
prev_left_ticks / prev_right_ticks start at 0, so the first update() computes the delta from
zero. reset() restores the pose but not the tick baseline, and there is no handling for a
fixed-width counter wrapping round.
'''
why = '''
If the planner board restarts while the STM32 keeps counting, the pose jumps by the whole
accumulated count (31 m for 50,000 ticks) and the reported speed is absurd. A 16-bit counter
wraps after ~20 m of travel.
'''
hint = '''
The first reading can only establish a baseline; it cannot be a measurement of motion.
'''

