[[finding]]
id = "TKN-102"
title = "Pose-update tests never check the arc endpoint; a wrong-direction turn passes all 8"
severity = "high"
category = "tests"
file = "tests/kinematics_test.py"
anchor = "def test_pose_arc_chord_length():"
symbol = "test_pose_arc_chord_length"
source = "reviewer"
confidence = "reproduced"
lead_checked = true
reviewed_line = 355
what = '''
TESTs 12-19 check only invariants: |chord| (16), dtheta = omega*dt (15), rotation-equivariance
(17), mirror symmetry (19), straight-line cases (12-14). No test compares (dx, dy) to the
closed-form arc endpoint, e.g. v=1, omega=1, dt=pi/2 from theta=0 -> (1, 1, pi/2). An
implementation whose position moves along the MIRRORED arc (left turn displaces the robot to the
right) while dtheta stays correct satisfies every one of these invariants.
'''
why = '''
compute_pose_update feeds odometry/dead-reckoning; a sign error in the arc would put the
estimated pose on the wrong side of the path while the suite stays 23/23 green.
'''
evidence = '''
Mutation test: cd "/c/Users/evan8/Desktop/Navi Bot" && python
C:/Users/evan8/AppData/Local/Temp/claude/738ef417e18052f3/0a4a6808-43fe-4936-9d58-6cdc90f47f1a/code_review/evidence/reviewer-scripts/tests_control/mutant_kin.py
monkeypatches compute_pose_update to use the mirrored turn for position (left turn
v=1,w=1,dt=0.5 -> dy=-0.122) and runs TESTs 12-19 -> 'ALL POSE TESTS PASS ON MUTANT: True'.
'''
hint = '''
Add closed-form endpoint checks: quarter circle (v=1, omega=1, dt=pi/2 -> dx=1, dy=1), a right
turn (dy<0 for omega<0), pure rotation (v=0 -> dx=dy=0), and negative v (reverse arc).
'''

