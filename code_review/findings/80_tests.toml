# Test suites
#
# Curated code-review findings. One [[finding]] per defect.
# `anchor` is a literal piece of the offending line; the report re-locates it on
# every build, so line numbers never go stale. See code_review/README.md for the
# field reference and how findings are marked fixed.

[[finding]]
id = "TAD-101"
title = "Test CONTACT (0.75) has drifted from DWA's CONTACT (0.875); hazard 'no collision' accepts footprint violations"
severity = "high"
category = "tests"
file = "tests/astar_dwa_integration_test.py"
anchor = "CONTACT = ROBOT_RADIUS + CELL_RADIUS  # 0.75 m"
source = "reviewer"
confidence = "reproduced"
lead_checked = true
reviewed_line = 36
what = '''
dwa.py L27 defines CONTACT = ROBOT_RADIUS + CELL_RADIUS*1.25 = 0.875, while the integration
suites hard-code 0.75: astar L36, dstar L33, warehouse_map_test L317. The hazard-collision
checks (astar L297, dstar L337, warehouse L388) use the smaller value.
'''
why = '''
Robots that get closer to the hazard than DWA's own contact envelope still pass 'no collision'.
The yield tests therefore cannot detect that DWA is violating its own safety margin.
'''
evidence = '''
python -c 'import navi_bot.planners.dwa as d; print(d.CONTACT)' -> 0.875. python
code_review/evidence/reviewer-scripts/tests_integration/clearance_probe.py reconstructs the 0.1
s sub-steps: astar #4 min_hazard_clear=0.833, dstar #4 min_hazard_clear=0.820, warehouse #7
0.878, #8 0.883. All are below or about equal to 0.875, and all PASS.
'''
hint = '''
Import CONTACT (and ROBOT_RADIUS) from navi_bot.planners.dwa instead of duplicating them.
'''

[[finding]]
id = "TAD-103"
title = "Integration suites test hand-rolled follower loops, not the shipped PathFollower/RobotController"
severity = "high"
category = "tests"
file = "tests/astar_dwa_integration_test.py"
anchor = "def follow_path(dwa, grid, start, theta, waypoints,"
symbol = "follow_path"
source = "reviewer"
confidence = "confirmed"
lead_checked = true
reviewed_line = 101
what = '''
Six copy-pasted loops (astar follow_path/drive_with_hazard, dstar follow_path/drive_with_hazard,
warehouse drive/drive_with_hazard) re-implement PathFollower.target. path_follower.py L10-12
claims 'the integration tests can drive the very same implementation, so the follower that ships
is the follower that gets tested', but no suite imports PathFollower. The loops also differ from
production. Lookahead is 1.5 in astar follow_path and both drive_with_hazard copies in the
astar/dstar suites, versus PathFollower's 1.0. Production calls DWA every 20 ms
(robot_controller.py L62), the tests every 0.5 s. Production feeds LIDAR points (continuous,
within 1.5 m, transformed by world_obstacles), the tests feed integer cell centres from the
grid. Production has a safety governor (L203-210) and feeds last_cmd after governor scaling; the
tests have no governor. The tests' initial heading is taken from the path, while production uses
whatever /pose says. Production poses and paths are in world metres (x along columns), the tests
use the x=row cell frame.
'''
why = '''
A green integration run says nothing about the controller that ships: the lookahead, control
rate, obstacle source, governor and frame are all different. Bugs specific to production (the 50
Hz timing mismatch and the world-frame mismatch, reported separately) cannot surface.
'''
evidence = '''
Grep: 'PathFollower' appears only in navi_bot/control/path_follower.py, robot_controller.py and
robot_controller_test.py. Compare astar L102 lookahead=1.5 with path_follower.py L33
lookahead=1.0.
'''
hint = '''
Drive the integration tests through PathFollower (better: RobotController.control_loop with a
simulated plant and LIDAR), and keep a single shared test helper.
'''

