[[finding]]
id = "TAD-106"
title = "Dashboard telemetry protocol (MAP/MAPROW/pose=/hazard at/HAZPRED/CLOUD) is undocumented, untested and fragile"
severity = "medium"
category = "design"
file = "tests/astar_dwa_integration_test.py"
anchor = "logger.warning(f\"Collision at cell ({r}, {c}), pose=({x:.2f},{y:.2f})\")"
symbol = "follow_path"
source = "reviewer"
confidence = "confirmed"
reviewed_line = 150
what = '''
The dashboard extracts trails with loose regexes: pose=\(..\) anywhere in a line (index.html
L568) and 'hazard at (r,c)' (L579), and assumes they line up 1:1 with CLOUD lines. The suites
emit extra matching lines: collision warnings containing 'pose=(..)' (astar L150/L153, dstar
L144, warehouse L258/L386), 'Collision with hazard at (..)' (warehouse L389), and waypoint_nav
summary lines 'reached pickup ... pose=(..)' (L240/L271). DWA logs CLOUD only on some calls
(none when it returns early or has no candidates), and the final pose is logged with no CLOUD.
No test or document pins the format, and the MAP/MAPROW emitter is copy-pasted 7 times.
'''
why = '''
Extra or missing lines shift the pose, hazard and cloud trails relative to each other, so the
dashboard can animate the hazard or cloud against the wrong robot pose. Any wording change in a
log line silently breaks visualisation.
'''
evidence = '''
Read index.html L515-598 and the emitters listed. Grep shows 'MAPROW' emitted in 7 places across
5 test files.
'''
hint = '''
Move telemetry into one helper module with documented, uniquely-tagged lines (e.g. 'TLM pose x
y'), and add a small round-trip test for the parser.
'''

[[finding]]
id = "TAD-108"
title = "'yield_speed' is really a per-0.5 s displacement and is satisfied by any slowdown near the hazard"
severity = "medium"
category = "tests"
file = "tests/astar_dwa_integration_test.py"
anchor = "min_speed_near = min(min_speed_near, math.hypot(x - px, y - py))"
symbol = "drive_with_hazard"
source = "reviewer"
confidence = "reproduced"
reviewed_line = 274
what = '''
min_speed_near holds the displacement over one 0.5 s cycle, so yield_speed=0.2 actually means
0.4 cells/s. It is sampled whenever the hazard is within 2.0 and i>0, so accelerating from rest,
turning at a corner or slowing for static obstacles all count as 'yielding'. min_dist is also
sampled only at cycle starts (L271-272), not at the sub-steps. The same logic is copied into
dstar L313-314 and warehouse L361-362.
'''
why = '''
The pass criterion is looser than its name suggests, and the reported 'closest' distance
overstates the real clearance (astar #5 reports closest 1.15, while the sub-step minimum is
1.011).
'''
evidence = '''
Read the code. Saved log astar TEST 5: 'closest 1.15'. clearance_probe.py astar #5:
min_hazard_clear=1.011.
'''
hint = '''
Divide by the cycle time to get a real speed, sample per sub-step, and require the slowdown to
happen while the mover is ahead and inside the yield cone.
'''

