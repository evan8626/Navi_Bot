severity = "info"
category = "tests"
file = "tests/profiler_test.py"
anchor = "if elapsed is None or not (0.015 <= elapsed <= 0.5):"
symbol = "test_start_stop_returns_elapsed"
source = "reviewer"
confidence = "reproduced"
reviewed_line = 43
what = '''
Test 1 sleeps 20 ms and accepts 15-500 ms, and tests 5 and 8 rely on elapsed > 0.0 for a
'guaranteed miss'. On Windows perf_counter is QueryPerformanceCounter (100 ns resolution), and
Python 3.11+ sleep does not return early.
'''
why = '''
Low flake risk; noted because the suite depends on wall-clock time.
'''
evidence = '''
5 runs of 'python tests/profiler_test.py 1' measured 20.05-20.61 ms; python
C:/Users/evan8/AppData/Local/Temp/claude/738ef417e18052f3/0a4a6808-43fe-4936-9d58-6cdc90f47f1a/code_review/evidence/reviewer-scripts/tests_sensors/prof_probe.py:
'elapsed<=0 occurrences in 200k start/stop: 0'.
'''
hint = '''
Optionally inject a fake clock (time.perf_counter via a parameter) to make the timing tests
deterministic.
'''

[[finding]]
id = "TSC-101"
title = "scan_match spec expectations are mathematically right; plain point-to-point ICP still cannot pass tests 3 and 5"
severity = "info"
category = "tests"
file = "tests/scan_matching_test.py"
anchor = "* TRANSFORM CONVENTION — pinned to the project's own geometry utilities:"
source = "reviewer"
confidence = "reproduced"
reviewed_line = 13
what = '''
Checked the spec. make_current builds current = T^-1(reference) via inverse_transform_point, so
transform_point(current, T) == reference, and T is the correct expected answer (pose of the
current frame in the reference frame, column-vector CCW rotation). I wrote a textbook ICP from
scratch to check that the fixtures are solvable. A point-to-line ICP recovers tests 2-8 exactly
within tolerance. An SVD point-to-point ICP gets stuck in a local minimum on test 3 (8 deg pure
rotation) and test 5 (0.12,-0.08,4 deg) at the 2 cm / 0.5 deg tolerance, though it passes 2, 4,
6, 7 and 8.
'''
why = '''
The owner should know that the current 3/12 is the implementation's fault, not the spec's. Also,
the 2 cm / 0.5 deg cold-start tolerance effectively demands point-to-line (or a
better-conditioned) ICP, not vanilla point-to-point.
'''
evidence = '''
python
C:/Users/evan8/AppData/Local/Temp/claude/738ef417e18052f3/0a4a6808-43fe-4936-9d58-6cdc90f47f1a/code_review/evidence/reviewer-scripts/tests_sensors/icp_probe2.py:
'(0, 0, 0.1396) {} (0.0141, 0.049, 0.1072) False' vs '{'p2l': True} (0.0, -0.0, 0.1396) True';
'(0.12, -0.08, 0.0698) {} ... False' vs p2l '... True'; partial/noisy/large-motion pass.
'''
hint = '''
No change needed to the expectations. Optionally note in the module docstring that the
tolerances assume point-to-line ICP.
'''
