reviewed_line = 171
what = '''
Tests 5-7 (L171, L195, L219) call server.handler(ws, '/'). In current websockets releases (the
new asyncio implementation, default for websockets.serve since v14), the handler is called with
a single connection argument; the path is available as connection.request.path. The two-argument
form was deprecated in 10.1. A correct modern implementation, handler(self, websocket), would
fail these tests with TypeError, while the legacy form would fail at runtime under
websockets.serve.
'''
why = '''
The spec steers the implementation toward an API the dependency no longer calls that way.
'''
evidence = '''
