[[finding]]
id = "TWN-105"
title = "'End-to-end' waypoint test skips RobotController/DWA/PathFollower and fakes every state-machine trigger"
severity = "high"
category = "tests"
file = "tests/waypoint_nav_test.py"
anchor = "sm.is_at_goal = True"
symbol = "run_mission"
source = "reviewer"
confidence = "reproduced"
lead_checked = true
reviewed_line = 245
what = '''
The suite's docstring claims a full mission flow. In fact it (a) drives with
PurePursuitController plus a hand-rolled wheel loop, while production drives with
RobotController -> PathFollower -> DWA (robot_controller.py L182-197). (b) It sets sm.is_at_goal
= True directly (L245, L276) instead of waiting for RobotController to publish 'goal_reached' on
/nav_status. It does this even after a leg FAILED, because L245 runs unconditionally. (c) It
sets pickup_complete/delivery_complete directly (L248, L279) instead of letting the timers fire.
(d) It calls planner.current_pose_callback/goal_callback directly instead of publishing on the
bus (publish_pose/publish_goal, L92-111). (e) It reads planner.current_path, the planner's
internal grid-cell path, rather than the /planned_path message in world metres. (f) It ignores
the /goal_pose that StateMachine publishes and injects its own swapped goal.
'''
why = '''
None of these production links is exercised: /goal_pose from StateMachine -> planner,
/planned_path -> RobotController.path_callback, RobotController -> /nav_status ->
StateMachine.nav_status_callback, the safety governor, and the 'goal_reached' loop closure. Two
real state-machine bugs survive as a result: the transposed pickup goal and the delivery goal
that is never published (separate findings).
'''
evidence = '''
Read L124-289: RobotController, PathFollower and DWAPlanner are never imported (grep finds
PathFollower/RobotController only in robot_controller.py and robot_controller_test.py). The
wp_probe.py goal_callback trace for TEST 4 is [(1.0, 1.0), (1, 1), (18.0, 1.0), ...]. The
integer pair is StateMachine's own publish, and the test's manual publish_goal overrides it.
'''
hint = '''
Build the loop around RobotController: publish the goal through StateMachine, let
PathPlannerNode publish /planned_path, step control_loop on a simulated plant, and wait for
'goal_reached' on /nav_status. Do not assign the state-machine flags directly.
'''

