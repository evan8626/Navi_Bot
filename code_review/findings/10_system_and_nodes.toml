[[finding]]
id = "MP-101"
title = "PGM reader ignores maxval; 16-bit maps and non-255 maxval are misread, and P2 comments break it"
severity = "medium"
category = "robustness"
file = "navi_bot/map_publisher.py"
anchor = "magic, w, h = tokens[0], int(tokens[1]), int(tokens[2])"
symbol = "read_pgm"
source = "reviewer"
confidence = "reproduced"
reviewed_line = 92
what = '''
tokens[3] (maxval) is read but never used. P5 always reads 1 byte per pixel and classify divides
by 255. A maxval>255 (2-byte) file is silently mis-shaped or raises a reshape error, and a
maxval<255 file is scaled wrongly. The P2 branch splits the whole remainder, so a '#' comment in
the raster or a value >255 fails. Truncated P5 files fail with an opaque reshape error. The same
code is duplicated in maps/generate_map.py L240-264.
'''
why = '''
Maps exported by other tools (e.g. GIMP with maxval 100, or 16-bit images) would load with wrong
occupancy or crash without a clear message. map_publisher_test only feeds the generated file.
'''
evidence = '''
python code_review/evidence/reviewer-scripts/tests_integration/flip_pgm_probe.py: 'P5 maxval=100
[100,0] classify -> [[-1, 100]]' (white read as unknown); 'P5 16-bit 2x1 -> [[255, 255]]'
(65535,0 silently read as two white pixels); 'P2 with raster comment -> EXC ValueError ...
b'#''; 'P5 truncated -> EXC ValueError cannot reshape array of size 5 into shape (4,4)'.
'''
hint = '''
Honour maxval (choose dtype '>u2' for >255 and scale p by maxval), strip comments in P2,
validate the byte count with a clear error, and add these cases to map_publisher_test.
'''

[[finding]]
id = "PP-004"
title = "D* Lite is initialised and solved on every plan, then its result is thrown away"
severity = "medium"
category = "dead-code"
file = "navi_bot/path_planner.py"
anchor = "# D Star Lite local replanning"
symbol = "PathPlannerNode.planning_loop"
source = "lead"
confidence = "reproduced"
also_reported = 2
what = '''
After A* publishes its path, planning_loop() initialises D* Lite and runs
compute_shortest_path(), then only checks one g-value. No path is extracted, nothing is
published, and DStarLitePlanner.plan() - the incremental entry point - is never called.
dstar_last is written and never read; DWA_local_planner is constructed and never used.
'''
why = '''
The D* Lite work dominates the planning cycle and buys nothing, and the 'D* for local
replanning' in the module docstring does not exist in the running system.
'''
hint = '''
Either wire D* Lite in as the replanner (call plan() when the map changes and publish its path)
or remove it from the node until it is needed.
'''

