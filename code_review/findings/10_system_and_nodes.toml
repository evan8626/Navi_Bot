[[finding]]
id = "SM-106"
title = "Mission locations have no defined frame: tests pass (row, col), the node publishes them as world (x, y)"
severity = "medium"
category = "bug"
file = "navi_bot/state_machine.py"
anchor = "goal.x = self.current_mission.pickup_location[0]"
symbol = "StateMachine.handle_navigating_to_pickup"
source = "reviewer"
confidence = "reproduced"
reviewed_line = 201
what = '''
Mission locations are (row, col) grid cells everywhere in the tests. handle_navigating_to_pickup
copies pickup_location[0] into Pose2D.x and [1] into .y. PathPlannerNode.goal_callback treats
msg.x as world x, i.e. COLUMN (geometry.world_to_grid), so the planner's goal ends up
transposed. The node never converts cells to world metres (no grid_to_world, no resolution), so
on the 0.05 m warehouse map the goal is also off by a factor of 20.
'''
why = '''
When the real pipeline runs, the robot drives to the mirror-image cell of every asymmetric
pickup. waypoint_nav_test hides this because it overrides the goal by calling publish_goal with
the correct swap right afterwards.
'''
evidence = '''
python code_review/evidence/reviewer-scripts/tests_integration/wp_probe.py: for mission M007
pickup (6,1) the planner receives goal_callback (6, 1) from StateMachine, i.e. world x=6 -> col
6, row 1, while the test's own correctly-swapped publish is (1.0, 6.0). python
code_review/evidence/reviewer-scripts/tests_integration/prod_frame_probe.py on the warehouse
map: Mission pickup (18,60) gives 'state machine published /goal_pose x,y = (18, 60) -> planner
current_goal (row,col) = (1200, 360)' (transposed and x20, off the 200x200 map).
'''
hint = '''
Decide on one mission-location convention (world metres is the natural one) and convert with
grid_to_world at the publish site, swapping axes.
'''

