# System wiring and ROS 2 nodes
#
# Curated code-review findings. One [[finding]] per defect.
# `anchor` is a literal piece of the offending line; the report re-locates it on
# every build, so line numbers never go stale. See code_review/README.md for the
# field reference and how findings are marked fixed.

[[finding]]
id = "PP-001"
title = "A goal that arrives before the map crashes the planner node"
severity = "critical"
category = "bug"
file = "navi_bot/path_planner.py"
anchor = "self.DStar_local_planner.d_star_initialize(start, self.current_goal)"
symbol = "PathPlannerNode.planning_loop"
source = "lead"
confidence = "reproduced"
also_reported = 2
what = '''
planning_loop() runs A* (which returns None when it has no grid) and then always runs the D*
Lite section. With no map yet, DStarLitePlanner.occupancy_grid is None and get_successors()
indexes it.
'''
why = '''
Start-up order is not guaranteed in ROS 2. If the first goal and pose arrive before the latched
map does, the timer callback raises and the node dies; nothing restarts it.
'''
hint = '''
Nothing in planning_loop should run until a map has been received - guard the whole loop, not
just the A* call.
'''

[[finding]]
id = "RC-001"
title = "The 50 Hz control loop takes 40x its period whenever it follows a path"
severity = "critical"
category = "performance"
file = "navi_bot/robot_controller.py"
anchor = "cmd = self.dwa.plan(pose, self.last_cmd, target, self.world_obstacles())"
symbol = "RobotController.control_loop"
source = "lead"
confidence = "reproduced"
also_reported = 2
what = '''
control_loop() is on a 20 ms timer and calls DWAPlanner.plan() inside it. plan() evaluates 800
trajectories in pure Python and costs ~50 ms with no obstacles and close to a second with twenty
LIDAR returns in view.
'''
why = '''
The loop that the module docstring says 'must complete within the deadline (20 ms)' runs at 1-2
Hz in path mode. Commands are stale by the time they are published, and the safety governor in
the same loop is checked at the same slow rate.
'''
hint = '''
Separate the rates: plan at a rate DWA can sustain and let the fast loop do only the cheap work
(safety checks, publishing the latest command).
'''

[[finding]]
id = "RC-005"
title = "DWA is fed world metres but indexes its map as if they were grid cells"
severity = "critical"
category = "bug"
file = "navi_bot/robot_controller.py"
anchor = "self.dwa.set_occupancy_grid(occupancy_to_grid(msg))"
symbol = "RobotController.map_callback"
source = "lead"
confidence = "reproduced"
also_reported = 3
what = '''
path_planner publishes the path in world metres; pose and LIDAR points are in metres too.
DWAPlanner was written for the test 'sim frame' (1 cell = 1 unit, x = row, cell centres at
integers). robot_controller hands it the 0.05 m/cell map unchanged, and DWA does int(round(x)),
int(round(y)) on metric coordinates to look cells up.
'''
why = '''
Three things are wrong at once - scale (x20), axis order (world x is the column), and a
half-cell offset. More than half of the map's walls are classified as moving obstacles (so the
yield rule fires on shelves) and the map-bounds check accepts poses far outside the map. DWA's
distances (CONTACT, CELL_RADIUS, YIELD_*) are also in sim cells, not metres.
'''
hint = '''
DWA needs one explicit frame. Either convert at the boundary (as path_planner does with
world_to_grid) or give DWA the map resolution and origin and make every constant metric.
'''

[[finding]]
id = "SM-001"
title = "The delivery goal is never published, so no mission can complete"
severity = "critical"
category = "bug"
file = "navi_bot/state_machine.py"
anchor = "def handle_navigating_to_delivery(self):"
symbol = "StateMachine.handle_navigating_to_delivery"
source = "lead"
confidence = "reproduced"
also_reported = 3
what = '''
handle_navigating_to_pickup() builds a Pose2D from pickup_location and publishes it on
/goal_pose. handle_navigating_to_delivery() publishes nothing: it only waits for is_at_goal.
Mission.delivery_location is stored in __init__ and never read again.
'''
why = '''
After the pickup the robot is never told where to go. The state machine waits in DELIVERY_NAV
forever. The test suites do not notice because they set is_at_goal = True by hand instead of
driving the robot there.
'''
hint = '''
Compare the two handlers side by side: the delivery handler is missing the step the pickup
handler performs before it checks is_at_goal.
'''

[[finding]]
id = "SYS-001"
title = "The launched system can never move: nothing publishes pose or LIDAR data"
severity = "critical"
category = "design"
file = "navi_bot/robot_controller.py"
anchor = "self.pose_sub = self.create_subscription(Pose2D, '/pose', self.pose_callback, 10)"
source = "lead"
confidence = "reproduced"
also_reported = 1
what = '''
robot.launch.py starts map_publisher, robot_controller, state_machine and path_planner.
robot_controller subscribes to /pose and /scan and path_planner to /current_pose, but no node in
the package publishes any of them, and nothing consumes /cmd_vel. WheelOdometry and
LidarProcessor exist as classes but are not wired into any node.
'''
why = '''
With no pose, path_planner logs 'Current pose unknown, cannot plan' ten times a second and never
plans; robot_controller sits at pose (0, 0, 0) with an empty world. The README's 'autonomously
navigates a mapped environment' describes the test harness, not the launched graph.
'''
hint = '''
Decide which node owns localisation (an odometry node, or a kinematic simulator that integrates
/cmd_vel) and publish one pose topic from it; add it to the launch file.
'''

[[finding]]
id = "PP-002"
title = "A goal received before the map is converted with the wrong resolution, permanently"
severity = "high"
category = "bug"
file = "navi_bot/path_planner.py"
anchor = "self.current_goal = world_to_grid(msg.x, msg.y, self.map_origin, self.map_resolution)"
symbol = "PathPlannerNode.goal_callback"
source = "lead"
confidence = "reproduced"
also_reported = 2
what = '''
goal_callback() converts the goal from metres to a grid cell immediately, using map_resolution
and map_origin. Until the first map arrives those are the defaults (1.0 m/cell, origin 0,0). The
converted cell is stored; the original metres are not.
'''
why = '''
With the 0.05 m warehouse map, a goal at (5.0, 5.0) m received early becomes cell (5, 5) - a
point 25 cm from the map corner - and stays that way after the map arrives.
'''
hint = '''
Keep the goal in world coordinates and convert at planning time, when the map geometry is known.
'''

[[finding]]
id = "PP-003"
title = "A changed map never triggers a replan"
severity = "high"
category = "logic"
file = "navi_bot/path_planner.py"
anchor = "def map_callback(self, msg):"
symbol = "PathPlannerNode.map_callback"
source = "lead"
confidence = "reproduced"
also_reported = 2
what = '''
replanning_needed is set only by goal_callback(). map_callback() hands the new grid to the
planners and returns; planning_loop() exits immediately while replanning_needed is False.
'''
why = '''
The README's 'replans dynamically when obstacles appear' is not implemented at node level: after
an obstacle appears on the published path the robot keeps following the old path. (Today it only
replans by accident, because the state machine re-sends the goal five times a second - see
SM-002.)
'''
hint = '''
A map update is a reason to replan; decide whether every update should, or only one that touches
the current path.
'''

[[finding]]
id = "PP-005"
title = "The global planner ignores the robot's size: paths run 2.5 cm from walls"
severity = "high"
category = "logic"
file = "navi_bot/path_planner.py"
anchor = "grid = ((raw >= 50) | (raw == -1)).astype(int)"
symbol = "PathPlannerNode.map_callback"
source = "lead"
confidence = "reproduced"
also_reported = 1
what = '''
map_callback() binarises the occupancy grid and passes it straight to A*. Nothing inflates
obstacles by the robot radius (config's obstacle_inflation_radius: 0.3 is never read). A* treats
the robot as a point and happily routes its centre through the cell next to a wall.
'''
why = '''
The published path is not drivable by a 25 cm-radius robot. DWA then rejects every trajectory
near it (its own contact radius is 0.875), so the two planners deadlock against each other on
the real map.
'''
hint = '''
Inflate the grid by the robot's footprint before planning (maps/generate_map.py already has an
inflate() used for its connectivity check).
'''

[[finding]]
id = "PP-008"
title = "Every goal message forces a full replan, even when the goal has not changed"
severity = "high"
category = "logic"
file = "navi_bot/path_planner.py"
anchor = "self.replanning_needed = True"
symbol = "PathPlannerNode.goal_callback"
source = "lead"
confidence = "reproduced"
what = '''
goal_callback() unconditionally sets replanning_needed and clears dstar_initialized. The state
machine publishes the same goal on every tick (SM-002).
'''
why = '''
The planner re-runs A* and re-initialises D* Lite five times a second for a goal that never
changed - which also defeats the whole point of D* Lite, an incremental planner.
'''
hint = '''
Compare the incoming goal with the current one before discarding the plan.
'''

[[finding]]
id = "RC-002"
title = "The safety stop is direction-blind and blocks turning, so the robot cannot recover"
severity = "high"
category = "logic"
file = "navi_bot/robot_controller.py"
anchor = "if self.closest_obstacle_dist < 0.5:"
symbol = "RobotController.control_loop"
source = "lead"
confidence = "reproduced"
also_reported = 2
what = '''
The governor stops the robot when the closest LIDAR return in ANY direction is under 0.5 m, and
it zeroes angular velocity as well as linear.
'''
why = '''
An object behind or beside the robot stops it even when the way ahead is clear, and because
rotation is zeroed too it cannot turn away. The robot stays frozen until the object leaves by
itself. In an aisle under 1 m wide it never moves at all; under 2 m it is permanently limited to
half speed.
'''
hint = '''
A stop zone should consider the direction of travel, and the recovery behaviour (rotate? back
away?) needs to be a decision rather than an accident.
'''

[[finding]]
id = "RC-003"
title = "DWA's acceleration limits are exceeded 25x when it is called from the control loop"
severity = "high"
category = "bug"
file = "navi_bot/robot_controller.py"
anchor = "self.last_cmd = (float(velocity), float(omega))"
symbol = "RobotController.control_loop"
source = "lead"
confidence = "reproduced"
also_reported = 1
what = '''
DWA sizes its dynamic window as max_accel x 0.5 s (a hard-coded control period).
robot_controller calls it every 20 ms and feeds the previous command back as the current
velocity, so each call is allowed another 0.25 m/s.
'''
why = '''
The commanded speed goes 0 -> 1 m/s in 80 ms: 12.5 m/s^2 against a stated limit of 0.5 m/s^2.
The motors cannot follow, so DWA plans from a velocity the robot does not have. Using the
commanded rather than measured velocity hides the gap.
'''
hint = '''
The period DWA assumes and the period it is called at need to be the same number - see DW-002.
'''

[[finding]]
id = "RC-006"
title = "Sensor data is trusted forever: no timeout on /scan or /pose"
severity = "high"
category = "robustness"
file = "navi_bot/robot_controller.py"
anchor = "def lidar_callback(self, msg):"
symbol = "RobotController.lidar_callback"
source = "lead"
confidence = "reproduced"
also_reported = 2
what = '''
The controller stores the latest scan-derived obstacle list and the latest pose and uses them on
every cycle with no record of when they arrived. Before the first scan, closest_obstacle_dist is
infinity.
'''
why = '''
If the LIDAR or localisation stops publishing, the robot keeps driving on the last picture of
the world. If the first scan is late, it drives as if the room were empty. For a module whose
docstring describes a 'hard safety governor', staleness is the most likely real-world failure.
'''
hint = '''
Record arrival times and refuse to move on data older than a small multiple of the sensor
period.
'''

[[finding]]
id = "RC-104"
title = "Ctrl-C on real rclpy: shutdown() publish raises RCLError, so the stop Twist is never sent and cleanup is skipped"
severity = "high"
category = "bug"
file = "navi_bot/robot_controller.py"
anchor = "controller.shutdown()"
symbol = "main"
source = "reviewer"
confidence = "reproduced"
reviewed_line = 245
what = '''
rclpy's SIGINT handler shuts the context down before KeyboardInterrupt reaches main(); the
finally block then calls controller.shutdown() which publishes on an invalid context and raises,
so destroy_node() and rclpy.shutdown() never run. The mock's publish/shutdown never fail, so
tests cannot see it. Same try/finally pattern (without the publish) in
state_machine/path_planner/map_publisher main() calls rclpy.shutdown() unguarded.
'''
why = '''
The robot is not commanded to stop on shutdown - it keeps executing the last /cmd_vel unless the
base has its own timeout - and the process exits with a traceback.
'''
evidence = '''
Real ROS 2 (activate_ros2.ps1) + python
code_review/evidence/reviewer-scripts/src_nodes/real_shutdown.py (SIGINT raised from a timer
inside spin): 'Shutting down robot controller' / 'main() raised: rclpy._rclpy_pybind11 RCLError
Failed to publish: publisher's context is invalid'.
'''
hint = '''
Use rclpy.init(signal_handler_options=...) / install your own handler, or publish the zero Twist
before the context dies (e.g. on_shutdown callback / context.on_shutdown), and use
rclpy.try_shutdown().
'''

[[finding]]
id = "SM-003"
title = "Pickup/delivery 'one-shot' timers are periodic and never cancelled"
severity = "high"
category = "bug"
file = "navi_bot/state_machine.py"
anchor = "self.create_timer(2.0, self._pickup_done)"
symbol = "StateMachine.handle_picking_up"
source = "lead"
confidence = "reproduced"
also_reported = 2
what = '''
The 2 s pickup and delivery dwell is implemented with create_timer(). rclpy timers repeat until
cancelled; these are neither cancelled nor destroyed, and a new one is created for every pickup
and every delivery.
'''
why = '''
On the real robot the first mission's timers keep firing every 2 s forever, setting
pickup_complete / delivery_complete again and again, so later pickups and deliveries end as soon
as they start. Timers also accumulate: two per mission. The mock hides all of this because its
timers never fire at all.
'''
hint = '''
Either keep one timer and cancel it in its own callback, or record the time the dwell started
and compare against the clock on each tick.
'''

[[finding]]
id = "SM-005"
title = "An error silently discards the mission in progress, and ERROR is never observable"
severity = "high"
category = "logic"
file = "navi_bot/state_machine.py"
anchor = "def handle_error_state(self):"
symbol = "StateMachine.handle_error_state"
source = "lead"
confidence = "reproduced"
also_reported = 2
what = '''
When has_error is set, update_state_machine() transitions to ERROR and immediately calls
handle_error_state(), which clears the flag and transitions to IDLE in the same tick. Only the
final state is published, so /robot_state goes X -> IDLE and ERROR is never seen.
current_mission is left pointing at the failed mission and the next tick simply overwrites it
with the next one from the queue.
'''
why = '''
A failed pickup or delivery vanishes: not retried, not requeued, not reported. An operator
watching /robot_state cannot tell that anything went wrong.
'''
hint = '''
Decide what should happen to a failed mission (retry, requeue, park in a failed list) and stay
in ERROR long enough to publish it.
'''

