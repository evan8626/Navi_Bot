what = '''
battery_level is initialised to 100.0 and never updated from any topic (no subscription) - only
tests write it. low_threshold and critical_threshold are read but never used, so there is no
mid-mission low-battery or critical abort. Once in CHARGING with no mission the machine can only
stay there, because nothing raises battery_level.
'''
why = '''
