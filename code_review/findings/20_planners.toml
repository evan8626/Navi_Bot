[[finding]]
id = "DW-105"
title = "Window inverts when current speed exceeds the limit, sampling commands above max_vel_x"
severity = "low"
category = "robustness"
file = "navi_bot/planners/dwa.py"
anchor = "v_min = max(v_min_s, v_min_d)"
symbol = "DWAPlanner.compute_dynamic_window"
source = "reviewer"
confidence = "reproduced"
reviewed_line = 304
what = '''
If current_v > max_vel_x + accel*dt, v_min (from V_d) exceeds v_max (from V_s), and
linspace(v_min, v_max) samples speeds between them, all above the limit.
'''
why = '''
Over-limit commands after any overspeed (odometry noise, external push).
'''
evidence = '''
cd "/c/Users/evan8/Desktop/Navi Bot" && python
code_review/evidence/reviewer-scripts/src_planners/dwa_probe.py ->
"compute_dynamic_window((2.0,0),0.5) -> (1.75, 1.0, -0.75, 0.75)".
'''
hint = '''
Clamp the window to the static limits after intersecting (if v_min > v_max, use the nearest
feasible bound).
'''

