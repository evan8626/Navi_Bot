# Planning algorithms (A*, D* Lite, DWA)
#
# Curated code-review findings. One [[finding]] per defect.
# `anchor` is a literal piece of the offending line; the report re-locates it on
# every build, so line numbers never go stale. See code_review/README.md for the
# field reference and how findings are marked fixed.

[[finding]]
id = "DS-002"
title = "Map changes are missed when the caller updates its grid in place"
severity = "high"
category = "bug"
file = "navi_bot/planners/dstar_lite.py"
anchor = "self.previous_grid = self.occupancy_grid"
symbol = "DStarLitePlanner.set_occupancy_grid"
source = "lead"
confidence = "reproduced"
also_reported = 2
what = '''
set_occupancy_grid() keeps a reference to the previous grid, not a copy. If the caller edits its
array and passes the same object again, previous_grid and occupancy_grid are one object,
edge_changed() finds no differences, and no vertex is updated.
'''
why = '''
The planner keeps its old cost field and returns None (or a path through stale costs) although a
fresh planner on the same grid finds a route. Updating a costmap in place is the normal way to
maintain one.
'''
hint = '''
Change detection must compare against something the caller cannot modify.
'''

[[finding]]
id = "DS-003"
title = "Two map updates between plans lose the first one"
severity = "high"
category = "bug"
file = "navi_bot/planners/dstar_lite.py"
anchor = "def set_occupancy_grid(self, grid):"
symbol = "DStarLitePlanner.set_occupancy_grid"
source = "lead"
confidence = "reproduced"
what = '''
Only the last two grids are ever compared. If set_occupancy_grid() is called twice before the
next plan(), the changes introduced by the first call are never diffed. Conversely previous_grid
is never brought up to date after a plan, so the same diff is re-applied (and the whole grid
re-scanned) on every later plan().
'''
why = '''
In the node, /map callbacks and the planning timer are independent, so two map messages between
plans is ordinary. The first one's obstacles are then invisible to the planner for good.
'''
hint = '''
Track which cells have changed since the planner last processed them, rather than diffing two
snapshots at plan time.
'''

[[finding]]
id = "DS-006"
title = "After a map change D* Lite reports 'no path' although a detour exists"
severity = "high"
category = "bug"
file = "navi_bot/planners/dstar_lite.py"
anchor = "def heuristic_backward(pos, start):"
symbol = "heuristic_backward"
source = "lead"
confidence = "reproduced"
also_reported = 2
what = '''
Every move costs 1.0, diagonals included (cost()), so the true distance between cells is
max(|dr|, |dc|). The heuristic is Manhattan, |dr| + |dc|, which is up to twice that. D* Lite's
keys and its termination test assume the heuristic never over-estimates. After an obstacle is
added, the affected vertices' keys are inflated above the start's key, compute_shortest_path()
stops early with a stale g(start), and path extraction walks into a loop and returns None.
'''
why = '''
Incremental replanning - the reason to use D* Lite - fails on the simplest case there is: an
open grid with one new obstacle on the path. Roughly a quarter of random single-obstacle replans
fail. The 13/13 passing D* tests use hand-built scenarios that happen to avoid it.
'''
hint = '''
The heuristic and the edge-cost model must describe the same geometry. Work out what the
cheapest possible cost between two cells is under cost(), and compare it with what
heuristic_backward returns for a diagonal neighbour.
'''

[[finding]]
id = "DW-001"
title = "One DWA plan costs 50 ms to several seconds in pure Python"
severity = "high"
category = "performance"
file = "navi_bot/planners/dwa.py"
anchor = "for omega in np.linspace(omega_min, omega_max, 40):"
symbol = "DWAPlanner.plan"
source = "lead"
confidence = "reproduced"
also_reported = 1
what = '''
plan() rolls out 20 x 40 = 800 velocity pairs for 20 steps each and, for every pose, loops over
every obstacle calling geometry.distance() (np.sqrt on Python scalars). The work is 800 x 21 x N
distance calls in the interpreter.
'''
why = '''
This is what breaks the control loop (RC-001) and why the three DWA integration suites take
30-55 s each.
'''
hint = '''
The rollouts are identical arithmetic on 800 candidates - exactly the shape of problem numpy
arrays exist for. Profile first to see which lines dominate.
'''

[[finding]]
id = "DW-002"
title = "DWA hard-codes a 0.5 s control period that no caller is told about"
severity = "high"
category = "bug"
file = "navi_bot/planners/dwa.py"
anchor = "control_period = 0.5"
symbol = "DWAPlanner.plan"
source = "lead"
confidence = "reproduced"
also_reported = 4
what = '''
plan() takes no time step. Inside it, control_period = 0.5 sizes the dynamic window (max_accel x
0.5) and is passed to track_movers() as the time between observations. The tests happen to step
the simulation 0.5 s per call; robot_controller calls every 20 ms.
'''
why = '''
At any other call rate the acceleration limits are wrong (RC-003) and mover velocities are
mis-estimated by the ratio of the two periods, so predicted hazard positions lag the real
hazard. Repeated identical scans between LIDAR updates push the estimate to zero.
'''
hint = '''
The time since the last call is an input to this algorithm, not a constant.
'''

[[finding]]
id = "DW-003"
title = "Once anything is inside the contact radius, DWA can never move again"
severity = "high"
category = "logic"
file = "navi_bot/planners/dwa.py"
anchor = "for i, p in enumerate(pos):"
symbol = "DWAPlanner.score_trajectory"
source = "lead"
confidence = "reproduced"
also_reported = 1
what = '''
score_trajectory() rejects a trajectory if ANY pose on it is within CONTACT of an obstacle -
including pose 0, the robot's current position. If an obstacle is already within CONTACT (0.875,
wider than physical contact at 0.75), every candidate is rejected, plan() returns (0, 0), and
that includes reversing or turning away.
'''
why = '''
There is no escape manoeuvre: a person stepping close, or sensor noise, freezes the robot
permanently. On the real map, with un-inflated A* paths next to walls (PP-005), this is the
normal state.
'''
hint = '''
A trajectory that increases clearance is safer than standing still - the admissibility test
should be able to tell the difference.
'''

