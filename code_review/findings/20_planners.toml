[[finding]]
id = "DS-005"
title = "Every priority-queue removal rebuilds and re-heapifies the whole queue"
severity = "medium"
category = "performance"
file = "navi_bot/planners/dstar_lite.py"
anchor = "self.elements = [(p, i) for p, i in self.elements if i != item]"
symbol = "U.Remove"
source = "lead"
confidence = "reproduced"
also_reported = 1
what = '''
U.Remove() filters the entire list and calls heapify; Update() calls Remove() first, and
update_vertex() calls Remove() for every neighbour of every expanded vertex.
'''
why = '''
Each update costs time proportional to the queue length, so replans that touch many cells are
quadratic. A reviewer measured ~9 s for a replan on a 200x200 grid.
'''
hint = '''
Look up 'lazy deletion' for binary heaps: leave stale entries in the heap and skip them when
popped.
'''

