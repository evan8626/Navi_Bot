[[finding]]
id = "GE-103"
title = "Exact cell-border coordinates floor into the previous cell because of floating-point division"
severity = "low"
category = "robustness"
file = "navi_bot/utils/geometry.py"
anchor = "col = int(np.floor((x - origin[0]) / resolution))"
symbol = "world_to_grid"
source = "reviewer"
confidence = "reproduced"
reviewed_line = 172
what = '''
0.15/0.05 evaluates to 2.9999999999999996, so x = 0.15 m maps to col 2, not 3. 98 of the first
2000 exact multiples k*0.05 map to k-1. The mission stations happen to be unaffected.
'''
why = '''
Goals typed on round numbers can land one cell off (into an occupied neighbour, for example).
'''
evidence = '''
cd "/c/Users/evan8/Desktop/Navi Bot" && python
code_review/evidence/reviewer-scripts/src_planners/geo_pf_probe.py -> "x=0.15: col=2 expected
floor=3", "exact cell-border values k*0.05 mapping to k-1: 98 of 2000".
'''
hint = '''
Add a small epsilon before floor (or round to ~1e-9 first); validate resolution > 0.
'''

[[finding]]
