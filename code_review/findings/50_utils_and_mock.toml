0)]", "single wp returns same object: True".
'''
hint = '''
Validate resolution > 0 and return list(waypoints).
'''

[[finding]]
id = "MK-001"
title = "Destroying a mock node leaves its subscriptions live on the global bus"
severity = "low"
category = "tests"
file = "navi_bot/mock_ros2.py"
anchor = "def destroy_node(self):"
symbol = "Node.destroy_node"
source = "lead"
confidence = "reproduced"
what = '''
destroy_node() only logs. Callbacks stay in the module-level _topic_subscribers registry until
init() is called.
'''
why = '''
Nodes from one test keep reacting to messages published by the next unless every test remembers
to call init() - a source of order-dependent test behaviour.
'''
hint = '''
destroy_node() should undo what create_subscription() did.
'''

