# Utilities and the ROS mock
#
# Curated code-review findings. One [[finding]] per defect.
# `anchor` is a literal piece of the offending line; the report re-locates it on
# every build, so line numbers never go stale. See code_review/README.md for the
# field reference and how findings are marked fixed.

[[finding]]
id = "MK-101"
title = "Mock diverges from rclpy in ways the node code depends on (timers, delivery, types, params, shapes)"
severity = "high"
category = "tests"
file = "navi_bot/mock_ros2.py"
anchor = "class MockTimer:"
symbol = "MockTimer"
source = "reviewer"
confidence = "reproduced"
lead_checked = true
also_reported = 1
reviewed_line = 138
what = '''
Verified differences: (1) mock timers never fire (real: 10 firings of a 0.05 s timer in 0.5 s) -
hides the periodic-dwell-timer bug in state_machine; (2) mock publish delivers synchronously
inside publish() (real: [] until spun) - SM->planner->controller chains run re-entrantly in
tests; (3) mock publish accepts any type (real: TypeError 'Expected Twist, got String'); (4)
get_parameter on an undeclared name returns a value object whose double_value raises TypeError
(real: ParameterNotDeclaredException); (5) mock OccupancyGrid has flat width/height/resolution
and accepts those kwargs, real has only .info and rejects the kwargs -
LidarProcessor.update_costmap and tests/lidar_mock_test.py rely on the flat shape; (6) mock
Pose2D() rejects kwargs that real accepts; (7) mock LaserScan defaults angle_increment 0.1 (real
0.0); (8) QoS ignored: no latching (a late /map subscriber gets nothing on the mock, gets the
map on real), no depth; (9) destroy_node does not unregister callbacks from the global bus; (10)
spin() sleeps forever without running timers, so running any node under the mock silently does
nothing.
'''
why = '''
Tests pass against behaviour that real ROS does not have (and vice-versa), so the suite cannot
catch integration bugs like the stale dwell flags or the shutdown crash.
'''
evidence = '''
python code_review/evidence/reviewer-scripts/src_nodes/real_vs_mock.py under both backends.
Mock: 'OccupancyGrid().width: OK -> 100', 'get_parameter(undeclared): TypeError',
'publish(String) on a Twist publisher: OK', 'timer(0.05 s) fired ... 0', 'delivered
synchronously inside publish(): ['hello']'. Real: 'AttributeError ... no attribute 'width'',
'ParameterNotDeclaredException', 'TypeError: Expected <class geometry_msgs...Twist>', 'timer ...
fired ... 10', 'delivered synchronously ...: []', 'LidarProcessor.update_costmap(real-shaped
OccupancyGrid()): AttributeError ... 'height''.
'''
hint = '''
Give the mock an explicit executor (spin_once that fires due timers and drains a queue),
type-check publish, raise on undeclared params, shape OccupancyGrid like the real msg (.info
only), and unregister on destroy_node.
'''

[[finding]]
id = "GE-001"
title = "normalize_angle() loops once per turn: slow for large angles, infinite for inf"
severity = "medium"
category = "robustness"
file = "navi_bot/utils/geometry.py"
anchor = "while angle > np.pi:"
symbol = "normalize_angle"
source = "lead"
confidence = "reproduced"
also_reported = 2
what = '''
The angle is brought into range by subtracting 2*pi in a loop.
'''
why = '''
Cost is proportional to the angle's size, and float('inf') - one corrupt sensor value reaching a
heading - never terminates, hanging whichever callback called it (the DWA scoring loop and the
motion controller both do). motion_controller.py carries a second copy of the same loop.
'''
hint = '''
There are closed-form ways to wrap an angle that take the same time for any input.
'''

[[finding]]
id = "MK-003"
title = "The mock OccupancyGrid has a different shape from the real message"
severity = "medium"
category = "tests"
file = "navi_bot/mock_ros2.py"
anchor = "class OccupancyGrid:"
symbol = "OccupancyGrid"
source = "lead"
confidence = "reproduced"
also_reported = 1
what = '''
The mock exposes width, height and resolution directly on the message; nav_msgs/OccupancyGrid
has them under .info, with the origin pose.
'''
why = '''
Code tested against the mock does not run against ROS (LD-004), and the nodes carry `if
hasattr(msg, 'info')` branches whose real-ROS side no test executes. map_publisher even bolts a
SimpleNamespace .info onto the mock to compensate.
'''
hint = '''
A mock is only useful where it is indistinguishable from the real thing at the boundary the code
touches.
'''

[[finding]]
id = "PR-001"
title = "The profiler's deadline miss rate can exceed 100%"
severity = "medium"
category = "bug"
file = "navi_bot/utils/profiler.py"
anchor = "stats['deadline_miss_rate'] = misses / len(times)"
symbol = "PerformanceProfiler.get_statistics"
source = "lead"
confidence = "reproduced"
also_reported = 2
what = '''
The miss counter is a lifetime total; the divisor is the length of the history deque, which is
capped at history_size.
'''
why = '''
After more than history_size samples the rate is inflated - 400% in the probe - so the one
number meant to summarise real-time health is wrong for any long run.
'''
hint = '''
Numerator and denominator must count the same set of samples.
'''

[[finding]]
id = "WS-002"
title = "WebSocket broadcast cannot work on Python 3.11+ (work in progress)"
severity = "medium"
category = "bug"
file = "navi_bot/utils/websocket.py"
anchor = "await asyncio.wait([client.send(message) for client in self.clients])"
symbol = "WebSocketServer.broadcast"
source = "lead"
confidence = "reproduced"
known_wip = true
also_reported = 2
what = '''
asyncio.wait() has rejected bare coroutines since Python 3.11; the project runs on 3.12 and
3.14. The handler(websocket, path) signature is also the legacy one that current releases of the
websockets library no longer call, and the library is not declared as a dependency (PK-001).
'''
why = '''
The telemetry server cannot send a single frame. The dashboard's Live tab therefore has nothing
to connect to. Known and parked.
'''
hint = '''
Read the asyncio.wait and websockets changelogs for the versions you are running.
'''

[[finding]]
id = "GE-002"
title = "interpolate_path() can leave gaps of nearly twice the requested spacing"
severity = "low"
category = "bug"
file = "navi_bot/utils/geometry.py"
anchor = "num_points = int(dist / resolution)"
symbol = "interpolate_path"
source = "lead"
confidence = "reproduced"
also_reported = 1
what = '''
The number of sub-segments is int(dist / resolution), which rounds down.
'''
why = '''
A 0.19 m segment at 0.1 m resolution is returned as a single 0.19 m step. Callers that rely on
the spacing (collision checks along a path) are sampling more coarsely than they asked for.
'''
hint = '''
Which rounding direction guarantees spacing no larger than the resolution?
'''

