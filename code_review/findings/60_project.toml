[[finding]]
id = "GI-001"
title = "Compiled .pyc files are committed to the repository"
severity = "low"
category = "config"
file = ".gitignore"
anchor = "*.pyc"
source = "lead"
confidence = "reproduced"
what = '''
Five cpython-311 bytecode files under navi_bot/__pycache__ and navi_bot/utils/__pycache__ are
tracked.
'''
why = '''
Ignore rules do not apply to files that are already tracked, so they stay in every clone, show
up in diffs, and are stale (the project no longer runs on 3.11).
'''
hint = '''
git rm --cached removes a file from the index without deleting it from disk.
'''

[[finding]]
id = "GI-002"
title = "The .gitignore ignores itself, so the rules exist only on this machine"
severity = "low"
category = "config"
file = ".gitignore"
anchor = "# ignore .gitignore file"
source = "lead"
confidence = "reproduced"
also_reported = 1
what = '''
The file lists `.gitignore` and is untracked. It also carries rules for paths that do not exist
(navi_bot/path_planner/__pycache__, navi_bot/tests/) and five specific .pyc paths made redundant
by `*.pyc`.
'''
why = '''
A fresh clone has no ignore rules at all: node_modules, __pycache__ and editor settings would
all show up as untracked. COLCON_IGNORE and package-lock.json are ignored too, so a clone lacks
the marker that keeps colcon out of node_modules and has no reproducible dashboard install.
'''
hint = '''
Ignore files are normally committed; personal exclusions belong in .git/info/exclude.
'''

[[finding]]
id = "GI-003"
title = "No .gitattributes: line endings are converted implicitly"
severity = "low"
category = "config"
file = ".gitignore"
source = "lead"
confidence = "reproduced"
anchor = ""
open_if_missing_file = ".gitattributes"
what = '''
git warns 'LF will be replaced by CRLF' for 27 tracked files. There is no .gitattributes to pin
line endings, so they depend on each machine's core.autocrlf.
'''
why = '''
Shell-facing files (the .ps1, launch files, anything with a shebang read on Linux) can break
when checked out with the other convention, and whole-file diffs appear when contributors'
settings differ.
'''
hint = '''
A one-line .gitattributes makes the choice explicit.
'''

[[finding]]
id = "GM-001"
title = "World-to-cell conversion is done three different ways"
severity = "low"
category = "logic"
file = "maps/generate_map.py"
anchor = "cells = {name: (int(round(y / res)), int(round(x / res)))"
source = "lead"
confidence = "confirmed"
what = '''
stations_connected() uses int(round(v / res)), scatter_boxes() and the station printout use
int(v / res), and the planner's world_to_grid uses floor. For a station on a cell boundary these
disagree: delivery_1 at y = 9.1 m is 181.99999999999997 cells, so the connectivity check tests
row 182 while the planner uses row 181.
'''
why = '''
The generator's 'every station is reachable' guarantee is verified for a neighbouring cell, not
the one the robot will be sent to.
'''
evidence = '''
9.1 / 0.05 evaluates to 181.99999999999997 in IEEE double precision: round() gives 182, int()
and floor() give 181.
'''
hint = '''
One conversion function, used everywhere - and station coordinates that are not exactly on a
cell edge.
'''

