# Project infrastructure (CI, packaging, docs, config)
#
# Curated code-review findings. One [[finding]] per defect.
# `anchor` is a literal piece of the offending line; the report re-locates it on
# every build, so line numbers never go stale. See code_review/README.md for the
# field reference and how findings are marked fixed.

[[finding]]
id = "CI-001"
title = "CI can only fail if the LAST test suite fails"
severity = "critical"
category = "tests"
file = ".github/workflows/test.yml"
anchor = "python tests/AStar_planner_test.py"
source = "lead"
confidence = "confirmed"
also_reported = 2
what = '''
All 18 suites run as separate lines of one `run:` block on windows-latest, whose shell is
PowerShell. PowerShell does not stop when a native command (python) exits non-zero. GitHub
appends `exit $LASTEXITCODE` to the script, so the step's status is the exit code of the final
line alone.
'''
why = '''
17 of the 18 suites can fail outright and the workflow stays green. The badge has not been
telling you what you think it has.
'''
evidence = '''
Reproduced locally with GitHub's wrapper under Windows PowerShell 5.1: a script whose first
python command exits 1 and whose second exits 0 printed both and finished with exit code 0.
(pwsh 7 is not installed on this machine; it treats native exit codes the same way unless
PSNativeCommandUseErrorActionPreference is enabled, which GitHub does not do.)
'''
hint = '''
Options: one step per suite, a bash shell (which fails fast), or a single runner script that
aggregates exit codes.
'''

